[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docuground"
version = "0.1.0"
description = "Production RAG chatbot — Chat with your PDFs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "redis>=5.2.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "aiofiles>=24.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "fakeredis[lua]>=2.26.0",
]

[project.scripts]
docuground-rag = "app.rag_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
